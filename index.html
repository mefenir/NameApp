<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NameApp</title>
  <meta name="description" content="Save a name in seconds after you meet someone — and actually remember it." />
  <meta name="theme-color" content="#dcd7ce" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1917" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NameApp" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>
  </div>
  <nav id="tabs" aria-label="Main">
    <div class="inner">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span class="lbl">Add</span>
      </a>
      <a href="#/people" data-tab="people">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="7" rx="2"/><rect x="13" y="4" width="8" height="7" rx="2"/><rect x="3" y="13" width="8" height="7" rx="2"/><rect x="13" y="13" width="8" height="7" rx="2"/></svg>
        <span class="lbl">People</span>
      </a>
      <a href="#/review" data-tab="review">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M9 12l2 2 4-4"/></svg>
        <span class="lbl">Review</span>
        <span class="badge" id="review-badge" hidden></span>
      </a>
    </div>
  </nav>
  <div id="toast" role="status"><span id="toast-text"></span><button id="toast-action" hidden></button></div>
  <noscript>NameApp needs JavaScript to run.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
